<!-- usamos <aside> quando o conteúdo é secundário, como uma sidebar, um menu, etc. -->
<aside class="sidebar">

  <div class="top-controls">

    <div class="div">
      <span class="icon" onclick="themeWhite()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
      </span>

      <span class="icon" onclick="themeBlack()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
      </span>
    </div>

    <div class="div">
      <button 
        class="translations"
        onclick=""
      >
        PT
      </button>
      <button
        class="translations"
        onclick=""
      >
        ES
      </button>
      <button
        class="translations"
        onclick=""
      >
        EN
      </button>
    </div>
    <!-- temas e idiomas (futuramente) -->
    <!-- <app-theme-toggle></app-theme-toggle>
    <app-language-switcher></app-language-switcher> -->
  </div>

  <div class="profile">
    <div class="my-photo">
      <img src="../../../assets/images/preview-dark.png" alt="Minha Foto" />
    </div>
    <div class="info">
      <h2 class="title-name">Maria Luiza Ramos</h2>
      <h6 class="text-gradient">{{ 'software-engineering-student' | translate }}</h6>
      <p class="about-me">Sou desenvolvedora fullstack com foco em aplicações web e mobile. Tenho afinidade com as tecnologias Pyhton, Angular e Flutter. Atualmente em desenvolvimento mobile com Kotlin, IOS e Android.</p>
    </div>
  </div>

  <div class="download-btn">
    <button class="btn-cv-1" onclick="">
     Download CV
    </button>

    <div class="social-icons">
      <a href="https://github.com/" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <img src="../../../assets/icons/github.svg" alt="GitHub" class="icon-svg" />
      </a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <img src="../../../assets/icons/linkedin.svg" alt="LinkedIn" class="icon-svg" />
      </a>
    </div>
  </div>

  <div class="email">
    <p class="text-email">
      mluiza.ramosagmail.com
    </p>
  </div>

  <!-- Ícone de fechar (mobile) -->
  <!-- <button class="close-btn" *ngIf="isMobile()" (click)="toggleMenu()">✖</button> -->
</aside>
