<div class="layout-container">

  <!-- DESKTOP SIDEBAR -->
  <aside
    class="sidebar"
    *ngIf="!isMobile"
  >
    <app-sidebar></app-sidebar>
  </aside>

  <!-- MOBILE SIDEBAR (só aparece com toggle) -->
  <aside
    class="sidebar mobile"
    *ngIf="isMobileSidebarOpen && isMobile"
    [class.mobile-active]="isMobileSidebarOpen"
  >
    <app-sidebar></app-sidebar>
  </aside>

  <!-- CONTENT -->
  <div
    class="main-content"
    [class.full-width]="isMobile"
  >
    <!-- Botão menu só no mobile -->
    <button
      class="hamburger-btn"
      *ngIf="isMobile"
      (click)="toggleSidebar()"
      aria-label="Abrir menu"
    >
      ☰
    </button>

    <app-content></app-content>
  </div>
</div>
