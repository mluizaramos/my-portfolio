<div class="layout-container">

  <!-- exibe apenas se nao estiver no modo mobile   -->
  <aside
    class="sidebar"
    *ngIf="!isMobile"
  >
    <app-sidebar></app-sidebar>
  </aside>
  
  <!-- só aparece se o menu está aberto (isMobileSidebarOpen === true) e a tela for mobile -->
  <aside
    class="sidebar mobile"
    *ngIf="isMobile"
    [class.mobile-active]="isMobileSidebarOpen"
  >
    <app-sidebar></app-sidebar>
  </aside>

  <!-- o full-width é ativada no mobile, para ocupar 100% da largura -->
  <div
    class="main-content"
    [class.full-width]="isMobile"
  >
    <!-- só aparece no modo mobile -->
    <button
      class="hamburger-btn"
      *ngIf="isMobile"
      (click)="toggleSidebar()"
      aria-label="Abrir menu"
    >
      <i 
        class="fa"
        [ngClass]="isMobileSidebarOpen ? 'fa-xmark' : 'fa-bars'"
      ></i>
    </button>

    <!-- renderiza o conteúdo principal (ContentComponent) -->
    <app-content></app-content>
  </div>
</div>
